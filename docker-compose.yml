name: prestacode-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: prestacode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/src/main/resources/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prestacode-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cockpit-dashboard-backend
    container_name: prestacode-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      COCKPIT_DB_URL: jdbc:postgresql://postgres:5432/cockpit
      COCKPIT_DB_USER: postgres
      COCKPIT_DB_PASSWORD: postgres
      ERP_DB_URL: jdbc:postgresql://postgres:5432/erp_db
      ERP_DB_USER: postgres
      ERP_DB_PASSWORD: postgres
      COCKPIT_ALLOWED_ORIGINS: "*"
      COCKPIT_JWT_ISSUER: "http://localhost:8081/realms/cockpit"
      COCKPIT_SERVER_PORT: 8080
    networks:
      - prestacode-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cockpit-dashboard-frontend
    container_name: prestacode-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - prestacode-net

networks:
  prestacode-net:
    driver: bridge

volumes:
  postgres_data:
